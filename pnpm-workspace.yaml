packages:
  - "frontend"
  - "backend"
allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': true
  '@swc/core': true
  argon2: true
  bcrypt: true
  bigint-buffer: true
  bufferutil: true
  ccxt: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  zeromq: true
minimumReleaseAgeExclude:
  - icu-minify@4.14.6
  - next-intl-swc-plugin-extractor@4.14.6
  - next-intl@4.14.6
  - use-intl@4.14.6
